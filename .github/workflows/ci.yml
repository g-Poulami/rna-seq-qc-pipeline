name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "snakemake>=8,<9" pyyaml

      - name: Snakemake dry-run
        run: snakemake --dry-run --cores 1

      - name: Run full pipeline
        run: snakemake --cores 2 --printshellcmds

      - name: Verify outputs
        run: |
          test -f results/report.txt && echo "Pipeline completed successfully" || (echo "report.txt missing" && exit 1)

      - name: Upload pipeline results
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-results
          path: results/
          retention-days: 7
